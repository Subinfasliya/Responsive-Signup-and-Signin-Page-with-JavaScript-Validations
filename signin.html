<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Travel Website Application" />
    <meta name="author" content="Subin T S" />

    <title>Login</title>

    <!-- Favicon Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">

    <!-- Fontawesome CDN Link -->
    <script src="https://kit.fontawesome.com/bb121f03f5.js" crossorigin="anonymous"></script>

    <!-- Bootstrap CDN Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- External CSS link -->
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <!-- Header Section -->
    <header>
        <nav class="navbar navbar-expand-lg py-4  fixed-top">
            <div class="container">
                <a class="navbar-brand fw-bold fs-3" href="home.html">Travler</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse py-4 py-lg-0" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-3 gap-lg-5 fw-semibold ">

                        <li class="nav-item">
                            <a class="nav-link" href="signin.html">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link border border-secondary rounded-2 d-inline-block py-2 px-3"
                                href="signup.html">Sign Up</a>
                        </li>

                    </ul>

                </div>
            </div>
        </nav>

    </header>
    <!-- Header section ends -->

    <!-- Main section -->
    <main class="register-container">
        <div class="container  py-5  ">
            <h2 class="fw-bold text-center pt-5">Login</h2>
            <form class="signup-form-container" id="signinForm">

                <!-- Input field for  -->
                <div class="input-groups mb-4">
                    <label for="email" class="fw-bold mb-2">Email <span class="text-danger">*</span></label>
                    <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
                    <p class="text-danger invalid-message" id="loginEmailError"></p>
                </div>


                <!-- input field for user Password -->
                <div class="input-groups position-relative mb-4 ">
                    <label for="password" class="fw-bold mb-2">Password <span class="text-danger">*</span></label>

                    <input type="password" id="password" class="form-control" required minlength="8">
                    <button type="button" id="togglePassword" class="toggle-btn"><i
                            class="fa-solid fa-eye-slash mb-0"></i></button>


                    <p class="text-danger invalid-message" id="loginPasswordError"></p>

                </div>

               <p class="text-danger invalid-message" id="loginFailedError"></p>
                <button class="btn btn-warning w-100">Login</button>
            <p class="pt-3 mb-0">If you have not an account <a href="signup.html">Register</a></p>
            </form>
        </div>
    </main>
    <!-- Main section ends -->


    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Common JS  -->
     <script src="js/common.js"></script>
    <!-- Custom JS -->
    <script src="js/signin.js"></script>
</body>

</html>
